<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Decision Bubbles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #task-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        #task-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }

        .task-item {
            background: #f8f8f8;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .task-item:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .task-item.completed {
            background: #c8e6c9;
            border-color: #81c784;
        }

        .task-item-number {
            font-weight: bold;
            color: #666;
            margin-right: 8px;
        }

        .task-item.completed .task-item-number {
            color: #2e7d32;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay">
        <div id="task-container">
            <div id="task-title"></div>
            <div id="task-list"></div>
        </div>
    </div>
    <canvas id="confetti-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5ebe0);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xffeaa7, 0.3);
        pointLight.position.set(-3, 2, 2);
        scene.add(pointLight);

        // Create floor
        const floorGeometry = new THREE.PlaneGeometry(10, 10);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xdcc9aa });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Create walls (home environment)
        // Back wall
        const backWallGeometry = new THREE.BoxGeometry(10, 4, 0.2);
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xe8dcc8 });
        const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
        backWall.position.set(0, 2, -5);
        scene.add(backWall);

        // Left wall
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 10), wallMaterial);
        leftWall.position.set(-5, 2, 0);
        scene.add(leftWall);

        // Right wall
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 10), wallMaterial);
        rightWall.position.set(5, 2, 0);
        scene.add(rightWall);

        // Window
        const windowFrameGeometry = new THREE.BoxGeometry(2, 1.5, 0.1);
        const windowFrameMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7355 });
        const windowFrame = new THREE.Mesh(windowFrameGeometry, windowFrameMaterial);
        windowFrame.position.set(-2, 2.5, -4.95);
        scene.add(windowFrame);

        const windowGlassGeometry = new THREE.BoxGeometry(1.8, 1.3, 0.05);
        const windowGlassMaterial = new THREE.MeshStandardMaterial({
            color: 0xadd8e6,
            transparent: true,
            opacity: 0.3
        });
        const windowGlass = new THREE.Mesh(windowGlassGeometry, windowGlassMaterial);
        windowGlass.position.set(-2, 2.5, -4.9);
        scene.add(windowGlass);

        // Create desk
        const deskGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
        const deskMaterial = new THREE.MeshStandardMaterial({ color: 0xd4a574 });
        const desk = new THREE.Mesh(deskGeometry, deskMaterial);
        desk.position.set(0, 0.7, 0);
        desk.receiveShadow = true;
        scene.add(desk);

        // Desk legs
        const legGeometry = new THREE.BoxGeometry(0.1, 0.7, 0.1);
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0xa67c52 });
        const legPositions = [
            [-1.4, 0.35, -0.7],
            [1.4, 0.35, -0.7],
            [-1.4, 0.35, 0.7],
            [1.4, 0.35, 0.7]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeometry, legMaterial);
            leg.position.set(...pos);
            scene.add(leg);
        });

        // Chair
        const chairSeatGeometry = new THREE.BoxGeometry(0.6, 0.1, 0.6);
        const chairMaterial = new THREE.MeshStandardMaterial({ color: 0xb08968 });
        const chairSeat = new THREE.Mesh(chairSeatGeometry, chairMaterial);
        chairSeat.position.set(0, 0.5, 1.5);
        scene.add(chairSeat);

        const chairBackGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.1);
        const chairBack = new THREE.Mesh(chairBackGeometry, chairMaterial);
        chairBack.position.set(0, 0.8, 1.2);
        scene.add(chairBack);

        // Bookshelf
        const shelfGeometry = new THREE.BoxGeometry(1.5, 2, 0.4);
        const shelfMaterial = new THREE.MeshStandardMaterial({ color: 0xa67c52 });
        const bookshelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
        bookshelf.position.set(3.5, 1, -3);
        scene.add(bookshelf);

        // Books on shelf
        for (let i = 0; i < 5; i++) {
            const bookGeometry = new THREE.BoxGeometry(0.15, 0.25, 0.3);
            const bookColors = [0xc44569, 0x4a69bd, 0x60a3bc, 0xe55039, 0x78e08f];
            const bookMaterial = new THREE.MeshStandardMaterial({ color: bookColors[i] });
            const book = new THREE.Mesh(bookGeometry, bookMaterial);
            book.position.set(3.5 - 0.6 + i * 0.3, 1.5, -3);
            book.rotation.y = (Math.random() - 0.5) * 0.2;
            scene.add(book);
        }

        // Desk items
        // Notebook
        const notebookGeometry = new THREE.BoxGeometry(0.3, 0.02, 0.4);
        const notebookMaterial = new THREE.MeshStandardMaterial({ color: 0x8b9aa3 });
        const notebook = new THREE.Mesh(notebookGeometry, notebookMaterial);
        notebook.position.set(-0.8, 0.76, 0);
        notebook.rotation.y = Math.PI / 6;
        scene.add(notebook);

        // Pen holder
        const cupGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.2, 16);
        const cupMaterial = new THREE.MeshStandardMaterial({ color: 0xc9ada7 });
        const cup = new THREE.Mesh(cupGeometry, cupMaterial);
        cup.position.set(1, 0.85, 0.3);
        scene.add(cup);

        // Lamp
        const lampBaseGeometry = new THREE.CylinderGeometry(0.1, 0.12, 0.05, 16);
        const lampBaseMaterial = new THREE.MeshStandardMaterial({ color: 0x7f8c8d });
        const lampBase = new THREE.Mesh(lampBaseGeometry, lampBaseMaterial);
        lampBase.position.set(-1.2, 0.76, -0.5);
        scene.add(lampBase);

        const lampPoleGeometry = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8);
        const lampPole = new THREE.Mesh(lampPoleGeometry, lampBaseMaterial);
        lampPole.position.set(-1.2, 0.96, -0.5);
        scene.add(lampPole);

        const lampShadeGeometry = new THREE.ConeGeometry(0.15, 0.2, 16);
        const lampShadeMaterial = new THREE.MeshStandardMaterial({
            color: 0xf9ca24,
            emissive: 0xf9ca24,
            emissiveIntensity: 0.3
        });
        const lampShade = new THREE.Mesh(lampShadeGeometry, lampShadeMaterial);
        lampShade.position.set(-1.2, 1.26, -0.5);
        scene.add(lampShade);

        // Rug under desk
        const rugGeometry = new THREE.PlaneGeometry(4, 3);
        const rugMaterial = new THREE.MeshStandardMaterial({ color: 0xc8b6a6 });
        const rug = new THREE.Mesh(rugGeometry, rugMaterial);
        rug.rotation.x = -Math.PI / 2;
        rug.position.set(0, 0.01, 0.5);
        scene.add(rug);

        // Morandi color palette
        const morandiColors = [
            0xd4b5b0, // Dusty pink
            0xb4c4b7, // Sage green
            0xc9b8a3  // Taupe brown
        ];

        // Bubble data
        const bubbleData = [
            {
                text: 'Should I change into home clothes?',
                position: new THREE.Vector3(-1.5, 1.5, 0.5),
                color: morandiColors[0],
                tasks: [
                    'Ask yourself: Am I comfortable right now?',
                    'Check if clothes are nearby.',
                    'Give yourself a small goal: just do the "get clothes" step.',
                    'If clothes are in hand, do the next step: try putting them on.',
                    'After changing, immediately return to the original task.'
                ]
            },
            {
                text: 'What do I need to do today?',
                position: new THREE.Vector3(0, 2, 0),
                color: morandiColors[1],
                tasks: [
                    'Pause for a moment, take a deep breath.',
                    'Ask yourself: What MUST be done today?',
                    'Write them down, just keywords.',
                    'Sort these things from "easiest → hardest".',
                    'Start with the smallest, easiest one.'
                ]
            },
            {
                text: 'Should I take the meat out to defrost?',
                position: new THREE.Vector3(1.5, 1.5, 0.5),
                color: morandiColors[2],
                tasks: [
                    'First ask yourself: Will I cook this meat today?',
                    'Check the time now, how long does defrosting take?',
                    'Assess: Do I have 30 seconds to get it from the fridge?',
                    'If the answer is yes, just do one step: take the meat out and put it on a plate.',
                    'After completing, immediately return to what you were doing.'
                ]
            }
        ];

        // Create bubbles
        const bubbles = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        bubbleData.forEach((data, index) => {
            const geometry = new THREE.SphereGeometry(0.35, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.4,
                metalness: 0.2,
                roughness: 0.3,
                side: THREE.DoubleSide
            });
            const bubble = new THREE.Mesh(geometry, material);
            bubble.position.copy(data.position);
            bubble.castShadow = true;

            bubble.userData = {
                text: data.text,
                tasks: data.tasks,
                completed: false,
                originalY: data.position.y,
                floatOffset: index * Math.PI * 0.6
            };

            scene.add(bubble);
            bubbles.push(bubble);
        });

        // Create canvas for text texture
        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const context = canvas.getContext('2d');

            context.fillStyle = 'transparent';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Add shadow for better visibility
            context.shadowColor = 'rgba(0, 0, 0, 0.3)';
            context.shadowBlur = 4;
            context.shadowOffsetX = 2;
            context.shadowOffsetY = 2;

            context.fillStyle = '#2c3e50';
            context.font = 'bold 42px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            const maxWidth = 900;
            const words = text.split(' ');
            let lines = [];
            let currentLine = '';

            words.forEach(word => {
                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && currentLine !== '') {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            lines.push(currentLine);

            const lineHeight = 55;
            const startY = canvas.height / 2 - ((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                context.fillText(line, canvas.width / 2, startY + index * lineHeight);
            });

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // Add text to each bubble
        bubbles.forEach(bubble => {
            const texture = createTextTexture(bubble.userData.text, bubble.material.color);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 1,
                depthTest: false
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(1.4, 0.7, 1);
            bubble.add(sprite);
        });

        // Audio context for generating ethereal sounds
        let audioContext;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playEtherealSound(frequency) {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, audioContext.currentTime);
            filter.Q.setValueAtTime(10, audioContext.currentTime);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 2);
        }

        function playBurstSound() {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // Currently selected bubble
        let currentBubble = null;
        let completedTasks = [];

        // Click event handler
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bubbles);

            if (intersects.length > 0) {
                const bubble = intersects[0].object;
                if (!bubble.userData.completed) {
                    currentBubble = bubble;

                    // Play different frequency sounds
                    const frequencies = [432, 528, 639];
                    const index = bubbles.indexOf(bubble);
                    playEtherealSound(frequencies[index]);

                    // Show task overlay
                    showTaskOverlay(bubble);
                }
            }
        }

        function showTaskOverlay(bubble) {
            const overlay = document.getElementById('overlay');
            const taskTitle = document.getElementById('task-title');
            const taskList = document.getElementById('task-list');

            taskTitle.textContent = bubble.userData.text;
            taskList.innerHTML = '';
            completedTasks = [];

            bubble.userData.tasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                taskItem.innerHTML = `<span class="task-item-number">${index + 1}.</span>${task}`;
                taskItem.dataset.index = index;

                taskItem.addEventListener('dblclick', () => {
                    if (!taskItem.classList.contains('completed')) {
                        taskItem.classList.add('completed');
                        completedTasks.push(index);

                        // Check if all tasks are completed
                        if (completedTasks.length === bubble.userData.tasks.length) {
                            setTimeout(() => {
                                completeBubble(bubble);
                            }, 500);
                        }
                    }
                });

                taskList.appendChild(taskItem);
            });

            overlay.style.display = 'flex';
        }

        function completeBubble(bubble) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'none';

            bubble.userData.completed = true;

            // Play burst sound effect
            playBurstSound();

            // Bubble burst animation
            const initialScale = bubble.scale.clone();
            let scaleTime = 0;
            const scaleAnimation = () => {
                scaleTime += 0.05;
                const scale = 1 + Math.sin(scaleTime * 10) * 0.3;
                bubble.scale.set(scale, scale, scale);
                bubble.material.opacity -= 0.02;

                if (bubble.material.opacity <= 0) {
                    scene.remove(bubble);
                    showConfetti();
                } else {
                    requestAnimationFrame(scaleAnimation);
                }
            };
            scaleAnimation();
        }

        // Confetti animation
        function showConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            const confetti = [];
            const confettiCount = 150;
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#c44569'];

            for (let i = 0; i < confettiCount; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confetti.forEach((piece, index) => {
                    ctx.save();
                    ctx.translate(piece.x, piece.y);
                    ctx.rotate((piece.rotation * Math.PI) / 180);
                    ctx.fillStyle = piece.color;
                    ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size);
                    ctx.restore();

                    piece.y += piece.speed;
                    piece.rotation += piece.rotationSpeed;

                    if (piece.y > canvas.height) {
                        confetti.splice(index, 1);
                    }
                });

                if (confetti.length > 0) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    canvas.style.display = 'none';
                }
            }

            animateConfetti();
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Bubble floating animation
            bubbles.forEach(bubble => {
                if (!bubble.userData.completed) {
                    bubble.position.y = bubble.userData.originalY + Math.sin(time + bubble.userData.floatOffset) * 0.1;
                    bubble.rotation.y += 0.002;
                }
            });

            renderer.render(scene, camera);
        }

        // Event listeners
        window.addEventListener('click', onMouseClick);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
