<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 决策泡泡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #task-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        #task-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
            color: #333;
        }

        .task-item {
            background: #f8f8f8;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .task-item:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .task-item.completed {
            background: #c8e6c9;
            border-color: #81c784;
        }

        .task-item-number {
            font-weight: bold;
            color: #666;
            margin-right: 8px;
        }

        .task-item.completed .task-item-number {
            color: #2e7d32;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2000;
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay">
        <div id="task-container">
            <div id="task-title"></div>
            <div id="task-list"></div>
        </div>
    </div>
    <canvas id="confetti-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 添加光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 创建书桌
        const deskGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
        const deskMaterial = new THREE.MeshStandardMaterial({ color: 0xd4a574 });
        const desk = new THREE.Mesh(deskGeometry, deskMaterial);
        desk.position.set(0, 0.7, 0);
        desk.receiveShadow = true;
        scene.add(desk);

        // 创建桌腿
        const legGeometry = new THREE.BoxGeometry(0.1, 0.7, 0.1);
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0xa67c52 });
        const legPositions = [
            [-1.4, 0.35, -0.7],
            [1.4, 0.35, -0.7],
            [-1.4, 0.35, 0.7],
            [1.4, 0.35, 0.7]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeometry, legMaterial);
            leg.position.set(...pos);
            scene.add(leg);
        });

        // 添加一些桌面物品
        // 笔记本
        const notebookGeometry = new THREE.BoxGeometry(0.3, 0.02, 0.4);
        const notebookMaterial = new THREE.MeshStandardMaterial({ color: 0x8b9aa3 });
        const notebook = new THREE.Mesh(notebookGeometry, notebookMaterial);
        notebook.position.set(-0.8, 0.76, 0);
        notebook.rotation.y = Math.PI / 6;
        scene.add(notebook);

        // 笔筒
        const cupGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.2, 16);
        const cupMaterial = new THREE.MeshStandardMaterial({ color: 0xc9ada7 });
        const cup = new THREE.Mesh(cupGeometry, cupMaterial);
        cup.position.set(1, 0.85, 0.3);
        scene.add(cup);

        // 地板
        const floorGeometry = new THREE.PlaneGeometry(10, 10);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xe8e8e8 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 莫兰迪色系
        const morandiColors = [
            0xd4b5b0, // 豆沙粉
            0xb4c4b7, // 灰绿
            0xc9b8a3  // 灰棕
        ];

        // 泡泡数据
        const bubbleData = [
            {
                text: '我是不是应该去换家居服',
                position: new THREE.Vector3(-1.5, 1.5, 0.5),
                color: morandiColors[0],
                tasks: [
                    '先问自己：我现在舒服吗？',
                    '看看衣服是否在附近。',
                    '给自己一个小目标：只做"拿衣服"这一步。',
                    '如果衣服已经到手，让自己做下一步：试着穿上。',
                    '换好后立即回到原本的任务。'
                ]
            },
            {
                text: '我今天有哪些事情要做',
                position: new THREE.Vector3(0, 2, 0),
                color: morandiColors[1],
                tasks: [
                    '停一下，先做一次深呼吸。',
                    '问自己一个问题：有什么是 必须 今天完成的吗？',
                    '把它们写下来，只写关键词。',
                    '把这些事情按"最容易 → 最困难"排序。',
                    '先从最小、最容易的一件开始做。'
                ]
            },
            {
                text: '我是不是应该把肉从冰箱拿出来解冻',
                position: new THREE.Vector3(1.5, 1.5, 0.5),
                color: morandiColors[2],
                tasks: [
                    '首先问自己：我今天会做这块肉吗？',
                    '看一下现在的时间，解冻需要多久？',
                    '评估一下：我现在有 30 秒去从冰箱拿出来吗？',
                    '如果答案是 yes，那就只做一步：把肉拿出来放到盘子里。',
                    '完成后立刻回到原来的事情。'
                ]
            }
        ];

        // 创建泡泡
        const bubbles = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        bubbleData.forEach((data, index) => {
            const geometry = new THREE.SphereGeometry(0.3, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.85,
                metalness: 0.1,
                roughness: 0.4
            });
            const bubble = new THREE.Mesh(geometry, material);
            bubble.position.copy(data.position);
            bubble.castShadow = true;

            bubble.userData = {
                text: data.text,
                tasks: data.tasks,
                completed: false,
                originalY: data.position.y,
                floatOffset: index * Math.PI * 0.6
            };

            scene.add(bubble);
            bubbles.push(bubble);
        });

        // 创建画布用于文字纹理
        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const context = canvas.getContext('2d');

            context.fillStyle = 'transparent';
            context.fillRect(0, 0, canvas.width, canvas.height);

            context.fillStyle = '#ffffff';
            context.font = 'bold 40px Microsoft YaHei';
            context.textAlign = 'center';
            context.textBaseline = 'middle';

            const words = text.match(/.{1,8}/g) || [text];
            const lineHeight = 50;
            const startY = canvas.height / 2 - ((words.length - 1) * lineHeight) / 2;

            words.forEach((word, index) => {
                context.fillText(word, canvas.width / 2, startY + index * lineHeight);
            });

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 为每个泡泡添加文字
        bubbles.forEach(bubble => {
            const texture = createTextTexture(bubble.userData.text, bubble.material.color);
            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                opacity: 1
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.6, 0.6, 1);
            bubble.add(sprite);
        });

        // 音频上下文（用于生成空灵的声音）
        let audioContext;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playEtherealSound(frequency) {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, audioContext.currentTime);
            filter.Q.setValueAtTime(10, audioContext.currentTime);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 2);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 2);
        }

        function playBurstSound() {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.3);

            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // 当前选中的泡泡
        let currentBubble = null;
        let completedTasks = [];

        // 点击事件
        function onMouseClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bubbles);

            if (intersects.length > 0) {
                const bubble = intersects[0].object;
                if (!bubble.userData.completed) {
                    currentBubble = bubble;

                    // 播放不同频率的声音
                    const frequencies = [432, 528, 639];
                    const index = bubbles.indexOf(bubble);
                    playEtherealSound(frequencies[index]);

                    // 显示任务列表
                    showTaskOverlay(bubble);
                }
            }
        }

        function showTaskOverlay(bubble) {
            const overlay = document.getElementById('overlay');
            const taskTitle = document.getElementById('task-title');
            const taskList = document.getElementById('task-list');

            taskTitle.textContent = bubble.userData.text;
            taskList.innerHTML = '';
            completedTasks = [];

            bubble.userData.tasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                taskItem.innerHTML = `<span class="task-item-number">${index + 1}.</span>${task}`;
                taskItem.dataset.index = index;

                taskItem.addEventListener('dblclick', () => {
                    if (!taskItem.classList.contains('completed')) {
                        taskItem.classList.add('completed');
                        completedTasks.push(index);

                        // 检查是否全部完成
                        if (completedTasks.length === bubble.userData.tasks.length) {
                            setTimeout(() => {
                                completeBubble(bubble);
                            }, 500);
                        }
                    }
                });

                taskList.appendChild(taskItem);
            });

            overlay.style.display = 'flex';
        }

        function completeBubble(bubble) {
            const overlay = document.getElementById('overlay');
            overlay.style.display = 'none';

            bubble.userData.completed = true;

            // 播放破碎音效
            playBurstSound();

            // 泡泡破碎动画
            const initialScale = bubble.scale.clone();
            let scaleTime = 0;
            const scaleAnimation = () => {
                scaleTime += 0.05;
                const scale = 1 + Math.sin(scaleTime * 10) * 0.3;
                bubble.scale.set(scale, scale, scale);
                bubble.material.opacity -= 0.02;

                if (bubble.material.opacity <= 0) {
                    scene.remove(bubble);
                    showConfetti();
                } else {
                    requestAnimationFrame(scaleAnimation);
                }
            };
            scaleAnimation();
        }

        // 彩带动画
        function showConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.display = 'block';

            const confetti = [];
            const confettiCount = 150;
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#c44569'];

            for (let i = 0; i < confettiCount; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 10 + 5,
                    speed: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                confetti.forEach((piece, index) => {
                    ctx.save();
                    ctx.translate(piece.x, piece.y);
                    ctx.rotate((piece.rotation * Math.PI) / 180);
                    ctx.fillStyle = piece.color;
                    ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size);
                    ctx.restore();

                    piece.y += piece.speed;
                    piece.rotation += piece.rotationSpeed;

                    if (piece.y > canvas.height) {
                        confetti.splice(index, 1);
                    }
                });

                if (confetti.length > 0) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    canvas.style.display = 'none';
                }
            }

            animateConfetti();
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 泡泡浮动动画
            bubbles.forEach(bubble => {
                if (!bubble.userData.completed) {
                    bubble.position.y = bubble.userData.originalY + Math.sin(time + bubble.userData.floatOffset) * 0.1;
                    bubble.rotation.y += 0.002;
                }
            });

            renderer.render(scene, camera);
        }

        // 事件监听
        window.addEventListener('click', onMouseClick);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
